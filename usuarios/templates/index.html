{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a FocusDesk</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #1a1a1a, #2d2d2d);
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .split-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }

        .split-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            transition: all 0.5s ease;
        }

        .login-half {
            background: rgba(0, 0, 0, 0.3);
        }

        .register-half {
            background: rgba(255, 255, 255, 0.1);
        }

        .split-half:hover {
            flex: 1.2;
        }

        .logo {
            width: 100px;
            height: 100px;
            padding: 10px;
            background-color: black;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            margin-bottom: 2rem;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            margin-top: 1rem;
        }

        .btn-login {
            background: linear-gradient(45deg, #4A90E2, #357ABD);
        }

        .btn-register {
            background: linear-gradient(45deg, #E96443, #904E95);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .divider {
            width: 2px;
            height: 70%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.7), transparent);
            align-self: center;
        }

        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }

            .split-half {
                height: 50vh;
            }

            .divider {
                width: 70%;
                height: 2px;
                background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.7), transparent);
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="split-half login-half">
            <img src="{% static 'imgs/spider-white.png' %}" alt="Logo" class="logo" />
            <h1>¿Ya tienes cuenta?</h1>
            <p>Inicia sesión para acceder a tu espacio de trabajo y continuar con tus proyectos</p>
            <a href="{% url 'login' %}" class="btn btn-login">Iniciar Sesión</a>
        </div>

        <div class="divider"></div>

        <div class="split-half register-half">
            <img src="{% static 'imgs/spider-white.png' %}" alt="Logo" class="logo" />
            <h1>¿No tienes cuenta?</h1>
            <p>Regístrate ahora para comenzar a organizar tus proyectos de manera eficiente</p>
            <a href="{% url 'register' %}" class="btn btn-register">Registrarse</a>
        </div>
    </div>
</body>
</html>
